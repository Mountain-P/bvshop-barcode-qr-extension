<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BVSHOP 標籤版型設計器</title>
    <link rel="stylesheet" href="designer.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">BVSHOP BARCODE STUDIO</p>
          <h1>標籤版型設計器</h1>
        </div>
        <div class="topbar-actions">
          <button id="export-template" class="button secondary" type="button">匯出版型</button>
          <label class="button secondary file-button">
            匯入版型
            <input id="import-template" type="file" accept="application/json,.json">
          </label>
          <button id="print-labels" class="button primary" type="button">列印標籤</button>
        </div>
      </header>

      <div id="data-banner" class="data-banner" hidden>
        尚未取得 BVSHOP 商品資料。請回到商品列表，點「列印條碼」後再按「開啟標籤版型設計器」。目前仍可編輯與儲存版型。
      </div>

      <main class="workspace">
        <aside class="panel left-panel">
          <section class="panel-section">
            <div class="section-heading">
              <h2>版型</h2>
              <button id="new-template" class="text-button" type="button">新增</button>
            </div>
            <label class="field">
              <span>已儲存版型</span>
              <select id="template-select"></select>
            </label>
            <label class="field">
              <span>版型名稱</span>
              <input id="template-name" type="text" maxlength="60">
            </label>
            <div class="button-row">
              <button id="save-template" class="button primary compact" type="button">儲存</button>
              <button id="delete-template" class="button danger compact" type="button">刪除</button>
            </div>
          </section>

          <section class="panel-section">
            <h2>標籤尺寸</h2>
            <label class="field">
              <span>預設尺寸</span>
              <select id="label-preset">
                <option value="40x30">標準 40×30mm</option>
                <option value="40x25">標準 40×25mm</option>
                <option value="42x29">Brother 42×29mm</option>
                <option value="custom">自訂尺寸</option>
              </select>
            </label>
            <div class="two-columns">
              <label class="field">
                <span>寬度 mm</span>
                <input id="label-width" type="number" min="20" max="100" step="0.5">
              </label>
              <label class="field">
                <span>高度 mm</span>
                <input id="label-height" type="number" min="15" max="100" step="0.5">
              </label>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>標籤元件</h2>
              <button id="add-custom-text" class="text-button" type="button">＋文字</button>
            </div>
            <div id="element-list" class="element-list"></div>
          </section>
        </aside>

        <section class="canvas-panel">
          <div class="canvas-toolbar">
            <label class="field inline-field">
              <span>預覽商品</span>
              <select id="preview-item"></select>
            </label>
            <div class="zoom-note">拖曳元件移動位置；拖曳右下角控制點調整大小</div>
          </div>
          <div class="canvas-scroll">
            <div class="ruler-label ruler-top">mm</div>
            <div id="label-stage" class="label-stage" aria-label="標籤版型預覽"></div>
          </div>
          <div id="layout-warning" class="layout-warning" hidden></div>
        </section>

        <aside class="panel right-panel">
          <section class="panel-section inspector-section">
            <div class="section-heading">
              <h2>元件設定</h2>
              <span id="selected-element-name" class="selection-name">未選取</span>
            </div>
            <div id="inspector-empty" class="empty-state">點選畫布上的元件開始編輯。</div>
            <div id="inspector" hidden>
              <div class="four-columns">
                <label class="field"><span>X</span><input id="element-x" type="number" step="0.5"></label>
                <label class="field"><span>Y</span><input id="element-y" type="number" step="0.5"></label>
                <label class="field"><span>寬</span><input id="element-width" type="number" step="0.5"></label>
                <label class="field"><span>高</span><input id="element-height" type="number" step="0.5"></label>
              </div>
              <div id="text-controls">
                <label class="field">
                  <span>字體</span>
                  <select id="element-font">
                    <option value="Microsoft JhengHei">微軟正黑體</option>
                    <option value="Noto Sans TC">思源黑體／Noto Sans TC</option>
                    <option value="PingFang TC">蘋方繁體</option>
                    <option value="Arial">Arial</option>
                    <option value="sans-serif">系統無襯線字體</option>
                    <option value="serif">系統襯線字體</option>
                  </select>
                </label>
                <div class="two-columns">
                  <label class="field"><span>字級 pt</span><input id="element-font-size" type="number" min="4" max="36" step="0.5"></label>
                  <label class="field">
                    <span>字重</span>
                    <select id="element-font-weight">
                      <option value="400">一般</option>
                      <option value="500">中等</option>
                      <option value="700">粗體</option>
                      <option value="900">黑體</option>
                    </select>
                  </label>
                </div>
                <label class="field">
                  <span>對齊</span>
                  <select id="element-align">
                    <option value="left">靠左</option>
                    <option value="center">置中</option>
                    <option value="right">靠右</option>
                  </select>
                </label>
                <label id="custom-text-field" class="field" hidden>
                  <span>自訂文字</span>
                  <textarea id="element-content" rows="3" maxlength="200"></textarea>
                </label>
              </div>
              <div class="button-row">
                <button id="move-forward" class="button secondary compact" type="button">上移一層</button>
                <button id="move-backward" class="button secondary compact" type="button">下移一層</button>
              </div>
              <button id="remove-element" class="button danger full-width" type="button" hidden>刪除此文字元件</button>
            </div>
          </section>

          <section class="panel-section products-section">
            <div class="section-heading">
              <h2>列印資料</h2>
              <button id="reload-data" class="text-button" type="button">重新讀取</button>
            </div>
            <div id="print-items" class="print-items"></div>
            <div class="print-summary">
              <span>標籤總數</span>
              <strong id="total-labels">0</strong>
            </div>
          </section>
        </aside>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <div id="print-area" aria-hidden="true"></div>
    <style id="print-page-style"></style>

    <script src="vendor/qrcode-generator.js"></script>
    <script src="vendor/jsbarcode.all.min.js"></script>
    <script src="designer.js"></script>
  </body>
</html>
