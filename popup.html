<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BVSHOP 條碼＋QR</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 300px;
        margin: 0;
        background: #f7f7fb;
        color: #24243b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { padding: 18px; }
      h1 { margin: 0 0 8px; color: #282883; font-size: 18px; }
      p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; }
      ol { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.65; }
      .status {
        margin-top: 14px;
        padding: 10px;
        border: 1px solid #d8d8e8;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        line-height: 1.5;
      }
      .ok { color: #177548; }
      .muted { color: #6b6b7f; }
    </style>
  </head>
  <body>
    <main>
      <h1>BVSHOP 條碼＋商品 QR</h1>
      <p>延用 BVSHOP 原本的條碼列印流程，只在標籤右側加入商品頁 QR Code。</p>
      <ol>
        <li>開啟 BVSHOP「商品列表」</li>
        <li>點商品的「列印條碼」</li>
        <li>保持「加入商品頁 QR Code」勾選</li>
        <li>照常設定數量並列印</li>
      </ol>
      <div id="status" class="status muted">尚未讀取列印資料。</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
