<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BVSHOP 條碼＋QR</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 300px;
        margin: 0;
        background: #f7f7fb;
        color: #24243b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { padding: 18px; }
      h1 { margin: 0 0 8px; color: #282883; font-size: 18px; }
      p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; }
      ol { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.65; }
      .status {
        margin-top: 14px;
        padding: 10px;
        border: 1px solid #d8d8e8;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        line-height: 1.5;
      }
      .ok { color: #177548; }
      .muted { color: #6b6b7f; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #3434c7;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #2727a7; }
    </style>
  </head>
  <body>
    <main>
      <h1>BVSHOP 條碼＋商品 QR</h1>
      <p>讀取 BVSHOP 商品資料，使用自訂版型設計並列印條碼與商品 QR Code。</p>
      <ol>
        <li>開啟 BVSHOP「商品列表」</li>
        <li>點商品的「列印條碼」</li>
        <li>設定各規格列印數量</li>
        <li>開啟設計器排版與列印</li>
      </ol>
      <div id="status" class="status muted">尚未讀取列印資料。</div>
      <button id="open-designer" type="button">開啟標籤版型設計器</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
